<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulta de Preços</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <p class="eyebrow">Consulta rápida</p>
        <h1>Consulta de preços</h1>
        <p class="description">Pesquise um produto pelo nome, código ou código de barras.</p>
      </header>

      <section class="search-panel" aria-label="Pesquisar produtos">
        <label for="busca">Produto</label>
        <input
          id="busca"
          type="search"
          placeholder="Digite ou escaneie um código de barras"
          autocomplete="off"
          autofocus
        />
        <p id="status" class="status" aria-live="polite">Carregando produtos...</p>
      </section>

      <section id="produtos" class="results" aria-live="polite" aria-label="Resultados da pesquisa"></section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
